[project]
name = "wind-forecast-monitor-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = ["integration: hits the live Elexon API; run with `pytest -m integration`"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
