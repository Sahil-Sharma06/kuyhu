name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../api
          ruff format --check . ../api
      - name: Tests with coverage (>= 70% overall)
        run: python -m pytest --cov --cov-report=term --cov-report=xml
      - name: Core logic coverage (>= 90% on selection and metrics)
        run: bash scripts/check_core_coverage.sh
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up -d --build --wait
      - name: Health via frontend proxy
        run: curl -fsS http://localhost:8080/api/health
      - name: Containers do not run as root
        run: |
          for svc in backend frontend; do
            uid=$(docker compose exec -T $svc id -u); echo "$svc uid=$uid"; test "$uid" != "0"
          done
      - if: always()
        run: docker compose down

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright (starts uvicorn + vite preview)
        run: npx playwright test
        working-directory: frontend
        env:
          PYTHON: python
      - name: Lighthouse CI (perf >= 0.8, a11y >= 0.9)
        working-directory: frontend
        run: |
          (cd ../backend && python -m uvicorn app.main:app --port 8000 &)
          npm run lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
