server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # The API sets its own security headers; adding them here too would duplicate them.
  location /api/ {
    proxy_pass http://backend:8000;
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri /index.html;
  }
}
